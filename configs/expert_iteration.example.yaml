run_name: expert_iteration_v1
output_dir: outputs/expert_iteration/expert_iteration_v1
seed: 42

runtime:
  profile: laptop
  generation_verification_mode: sequential
  generation: {mode: isolated, batch_size: 100, persistent: false}
  verification: {lifecycle: stage, workers: 2, persistent: false}
  memory: {streaming: true, max_queue_size: 32}
  cache: {backend: sqlite}
  debug: {save_full_source_on_failure_only: true}
  memory_guard: {enabled: true, warning_ratio: 0.85, critical_ratio: 0.95}

data:
  train_path: data/processed/lean_workbook_train.jsonl
  eval_path: data/processed/lean_workbook_eval.jsonl
  discovery_path: data/processed/lean_workbook_discovery.jsonl
  monitor_path: data/processed/lean_workbook_monitor.jsonl
  benchmark_path: data/processed/minif2f_benchmark.jsonl
  overlap_policy: error

initial_model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  sft_adapter: outputs/sft/adapter
  tokenizer: Qwen/Qwen2.5-1.5B-Instruct
  skip_initial_sft: true
  checkpoint_strategy: fixed_anchor
  merged_sft0_path: outputs/sft/sft0_merged

iterations:
  max_iterations: 3
  minimum_new_proofs_to_train: 500
  stop_when_training_skipped: false

discovery:
  statements_per_iteration: 10000
  batch_statements: 100
  max_consecutive_zero_success_rounds: 2
  hard_archive_after_rounds: 3
  solved_easy_success_ratio: 1.0
  pool_mix:
    new: 0.30
    frontier: 0.35
    unsolved: 0.30
    audit: 0.05
  generation:
    backend: auto
    samples_per_statement: 4
    temperature: 0.9
    top_p: 0.95
    max_new_tokens: 1024
    batch_size: 8
    load_in_4bit: true
    gpu_memory_utilization: 0.9
    enforce_eager: false
    kv_cache_memory_bytes: null
  sampling_budget:
    new: 4
    frontier: 4
    unsolved: 6
    audit: 2

verification:
  lean_project_path: lean_project
  imports: [Mathlib]
  num_workers: 2
  queue_maxsize: 128
  timeout_seconds: 120
  warmup_timeout_seconds: 120
  heartbeat_interval_seconds: 5
  heartbeat_timeout_seconds: 30
  max_worker_restarts: 3
  max_task_retries: 2
  shutdown_timeout_seconds: 10
  reject_sorry: true
  reject_admit: true
  reject_axiom: true
  use_cache: true

proof_bank:
  max_verified_proofs_per_statement: 3
  max_training_proofs_per_statement: 1
  selection_strategy: random_verified

train_mix_first_iteration:
  anchor: 0.65
  historical_expert: 0.0
  current_expert: 0.35

train_mix:
  anchor: 0.50
  historical_expert: 0.25
  current_expert: 0.25

category_sampling:
  enabled: true
  strategy: sqrt_inverse_frequency
  max_oversample_factor: 4.0

training:
  use_qlora: true
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  learning_rate: 0.00002
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 2048
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

execution:
  isolate_gpu_stages: true
  generation_timeout_seconds: 7200
  training_timeout_seconds: 86400
  flashinfer_sampler: true

monitor:
  enabled: true
  pass_k: [1, 4, 8]
  samples_per_statement: 8
  fixed_generation_seed: true

benchmark:
  enabled: true
  run_mode: final_only
  pass_k: [1, 4, 8]
  samples_per_statement: 8
  fixed_generation_seed: true

checkpoint_selection:
  metric: latest_completed

stopping:
  min_discovery_new_solved_ratio: 0.02
  max_eval_loss_degradation: 0.10
  min_monitor_improvement: 0.002
  patience: 2
